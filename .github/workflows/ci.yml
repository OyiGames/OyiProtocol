name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # OyiGames/flatbuffers (upstream + fixes). Keep in step with FLATC_VERSION in scripts/verify.py,
  # third_party/flatbuffers-net and OyiEngine's vcpkg overlay port.
  FLATBUFFERS_TAG: v25.12.19-oyi.1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for flatc --conform against the previous release

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }

      - name: ruff
        run: |
          pip install ruff
          ruff check scripts
          ruff format --check scripts

      - name: flatc ${{ env.FLATBUFFERS_TAG }}
        run: |
          curl -fsSL -o flatc.zip "https://github.com/OyiGames/flatbuffers/releases/download/${FLATBUFFERS_TAG}/flatc-${FLATBUFFERS_TAG}-linux-x64.zip"
          mkdir -p "$RUNNER_TEMP/flatc"
          unzip -q flatc.zip -d "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"

      # C++ headers from the same fork tag as flatc. The C# runtime is vendored in third_party/.
      - name: flatbuffers C++ headers
        run: |
          git clone --quiet --depth 1 --branch "${FLATBUFFERS_TAG}" --filter=blob:none --sparse \
            https://github.com/OyiGames/flatbuffers.git "$RUNNER_TEMP/flatbuffers"
          git -C "$RUNNER_TEMP/flatbuffers" sparse-checkout set include

      - name: Generate, build, round trip
        env:
          CXX: g++
        run: python scripts/verify.py --flatbuffers-root "$RUNNER_TEMP/flatbuffers"
